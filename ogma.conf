<VirtualHost *:80>
    ServerName ogma.local
    DocumentRoot /mnt/c/Ogma/webroot/public

    <Directory /mnt/c/Ogma/webroot/public>
        AllowOverride All
        Require all granted
        FallbackResource /index.php
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/ogma_error.log
    CustomLog ${APACHE_LOG_DIR}/ogma_access.log combined
</VirtualHost>
